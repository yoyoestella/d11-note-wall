function line(canvas,labels,series,colors){
  const c=document.getElementById(canvas),x=c.getContext('2d');
  const W=c.width=c.parentElement.clientWidth*2,H=c.height=560;
  const P={l:150,r:40,t:60,b:70};const maxV=Math.max(...series.flatMap(s=>s.data.filter(v=>v!=null)))*1.15||1;
  x.font='24px sans-serif';x.textAlign='right';
