const PAGE_SIZE = 24;
let currentTab = 'all';
let shownCount = PAGE_SIZE;

const CAT_META = {"snack":["🍿 零食特产","#fa5252"],"seasoning":["🍜 速食粮油","#e03131"],"tea_coffee":["🍵 茶饮咖啡","#c92a2a"],"wine":["🍷 酒水","#a61e4d"],"health":["🌿 滋补保健","#d0021b"]};
const TAB_NAME_TO_KEY = {"零食特产":"snack","速食粮油":"seasoning","茶饮咖啡":"tea_coffee","酒水":"wine","滋补保健":"health"};

function coverFallback(n, cls){
  const meta = CAT_META[n.tab_key] || ['🛒', '#d0021b'];
  const grad = 'linear-gradient(135deg,' + meta[1] + '22,' + meta[1] + '55)';
  return '<div class="' + cls + '" style="background:' + grad + '"><span class="ph-emoji">' + meta[0] + '</span><span class="ph-cat">' + (n.second_category_name || '') + '</span></div>';
}
function coverHtml(n, cls){
  if (n.first_file_id) {
    const fbData = encodeURIComponent(coverFallback(n, cls));
    return '<img class="' + cls + '" loading="lazy" data-fb="' + fbData + '" src="https://sns-na-i1.xhscdn.com/' + n.first_file_id + '?imageView2/2/w/540/format/webp" onerror="this.outerHTML = decodeURIComponent(this.dataset.fb)">';
  }
  return coverFallback(n, cls);
}
function noteUrl(id){ return 'https://www.xiaohongshu.com/discovery/item/' + id; }
function noteTypeBadge(t){
  if(String(t) === '2') return '<span class="note-type-badge">▶ 视频</span>';
  return '<span class="note-type-badge">🖼️ 图文</span>';
}

// 渲染 Tabs
const tabsEl = document.getElementById('tabs');
TAB_CONFIG.forEach((t, idx) => {
  const b = document.createElement('button');
  b.className = 'tab-btn' + (idx === 0 ? ' active' : '');
  b.textContent = t.label;
  b.dataset.key = t.key;
  b.onclick = () => switchTab(t.key);
  tabsEl.appendChild(b);
});

function switchTab(key){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  currentTab = key;
  shownCount = PAGE_SIZE;
  renderGrid();
  window.scrollTo({ top: document.querySelector('.tabs').offsetTop, behavior: 'instant' });
}

function renderGrid(){
  const notes = NOTES_BY_TAB[currentTab] || [];
  const container = document.getElementById('note-grid-container');
  if (!notes.length){
    container.innerHTML = '<div class="empty">该类目暂无符合的笔记案例</div>';
    return;
  }
  const visible = notes.slice(0, shownCount);
  const grid = document.createElement('div');
  grid.className = 'note-grid';
  visible.forEach(n => {
    const card = document.createElement('a');
    card.className = 'note-card';
    card.href = noteUrl(n.note_id);
    card.target = '_blank';
    card.rel = 'noopener';
    card.innerHTML =
      '<div style="position:relative;">' +
        coverHtml(n, 'note-cover') +
        noteTypeBadge(n.note_type) +
      '</div>' +
      '<div class="note-body">' +
        '<div class="note-title">' + (n.note_title || '').replace(/</g,'&lt;') + '</div>' +
        '<div class="note-meta">' +
          '<span class="author">@' + (n.author_nickname || '匿名') + '</span>' +
          '<span class="cat-tag">' + (n.second_category_name || '') + '</span>' +
        '</div>' +
        '<span class="note-link">查看原文 →</span>' +
      '</div>';
    grid.appendChild(card);
  });
  container.innerHTML = '';
  container.appendChild(grid);
  const moreWrap = document.createElement('div');
  moreWrap.className = 'load-more-wrap';
  if (notes.length > shownCount) {
    const remain = notes.length - shownCount;
    const nextBatch = Math.min(PAGE_SIZE, remain);
    moreWrap.innerHTML =
      '<button class="load-more-btn" id="load-more-btn">⬇ 显示更多 (+' + nextBatch + ')</button>' +
      '<div class="load-more-hint">已展示 ' + shownCount + ' / ' + notes.length + ' 篇</div>';
  } else if (notes.length > PAGE_SIZE) {
    moreWrap.innerHTML = '<div class="load-more-hint">已全部展示完 (' + notes.length + ' 篇)</div>';
  }
  container.appendChild(moreWrap);
  const btn = document.getElementById('load-more-btn');
  if (btn) {
    btn.onclick = () => {
      shownCount += PAGE_SIZE;
      renderGrid();
    };
  }
}

// 渲染热门类目词（按成交额分级）
function renderKeywords(){
  const el = document.getElementById('kw-cloud');
  if (!HOT_KEYWORDS.length){ el.innerHTML = '<span style="color:#aaa;font-size:12px;">暂无热点词</span>'; return; }
  HOT_KEYWORDS.slice(0, 16).forEach((k, i) => {
    let cls = 'kw-chip';
    if (i < 3) cls += ' up-strong';
    else if (i < 10) cls += ' up';
    const chip = document.createElement('span');
    chip.className = cls;
    chip.innerHTML = k.kw;
    el.appendChild(chip);
  });
}

// 渲染热点笔记
function renderHotNotes(){
  const el = document.getElementById('hot-notes-row');
  if (!HOT_NOTES.length){ el.innerHTML = '<span style="color:#aaa;font-size:12px;padding:8px;">暂无热点笔记</span>'; return; }
  HOT_NOTES.slice(0, 10).forEach((n, i) => {
    const card = document.createElement('a');
    card.className = 'hot-note-card';
    card.href = noteUrl(n.note_id);
    card.target = '_blank';
    card.rel = 'noopener';
    const rank = '<span class="hot-rank">' + (i+1) + '</span>';
    card.innerHTML =
      coverHtml(n, 'hot-note-cover') +
      rank +
      '<div class="hot-note-title">' + (n.note_title || '').replace(/</g,'&lt;') + '</div>';
    el.appendChild(card);
  });
}

renderKeywords();
renderHotNotes();
switchTab('all');
